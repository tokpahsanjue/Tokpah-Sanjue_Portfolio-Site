    <script>
      const galleryImages = ['20230405_171121.jpg','20230407_151700.jpg','20230410_114638.jpg','403060846_4562051354021036_4399201991716798730_n.jpg','70728681_1680320172104858_7529544210710528000_n.jpg','Cover 1.jpg','DSC_0117.JPG','DSC_0118.JPG','DSC_0121.JPG','IMG-20210319-WA0020.jpg','IMG-20210319-WA0023.jpg','IMG-20210319-WA0025.jpg','IMG-20240328-WA0021.jpg','IMG_20190926_083231.jpg','IMG_20230621_152431664.jpg','IMG_20230630_115819215.jpg','IMG_20230905_124639279.jpg','IMG_20230905_124651898_BURST000_COVER_TOP.jpg','IMG_20230908_125951498.jpg','IMG_20230929_104012602.jpg','IMG_20230929_104045705.jpg','IMG_20241125_102614_180.jpg','IMG_20250403_125801_870@1550528227.jpg','IMG_20250403_125825_949@1550528229.jpg','IMG_2909.JPG','IMG_2961.JPG','IMG_3504.jpg','IMG_3523.jpg','Screenshot 2024-11-09 091802.png','untitled.jpeg','WhatsApp Image 2024-12-29 at 05.25.08_6ab7db8d.jpg'];
      const grid = document.querySelector('#gallery-grid');
      galleryImages.forEach((fileName, index) => {
        const figure = document.createElement('figure');
        figure.className = 'gallery-card reveal';
        const image = document.createElement('img');
        image.src = `assets/gallery/${encodeURIComponent(fileName)}`;
        image.alt = `Tokpah Sanjue professional work photo ${String(index + 1).padStart(2, '0')}`;
        image.loading = index < 3 ? 'eager' : 'lazy';
        image.decoding = 'async';
        const caption = document.createElement('figcaption');
        caption.textContent = `Work photo ${String(index + 1).padStart(2, '0')}`;
        figure.append(image, caption);
        grid.append(figure);
      });
    </script>
